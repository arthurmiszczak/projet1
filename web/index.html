<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compte</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
</head>
<body>
    <section id="loginSection">
        <h1>Connexion</h1>
        <form id="loginForm">
            <label for="loginInput">Identifiant</label>
            <input id="loginInput" name="login" type="text" required>

            <label for="passwordInput">Mot de passe</label>
            <input id="passwordInput" name="password" type="password" required>

            <button type="submit">Se connecter</button>
        </form>
        <button id="showSignup" type="button">Créer un compte</button>
    </section>

    <section id="signupSection" hidden>
        <h1>Créer un compte</h1>
        <form id="signupForm">
            <label for="signupLogin">Identifiant</label>
            <input id="signupLogin" name="inputValue" type="text" required>

            <label for="signupPassword">Mot de passe</label>
            <input id="signupPassword" name="inputValue2" type="password" required>

            <button type="submit">S'inscrire</button>
        </form>
        <button id="showLogin" type="button">Retour à la connexion</button>
    </section>

    <section id="dashboardSection" hidden>
        <h1 id="welcomeMessage"></h1>
        <button id="logoutButton" type="button">Déconnexion</button>

        <section id="adminSection" hidden>
            <h2>Gestion des comptes</h2>
            <ul id="usersList"></ul>
        </section>
    </section>
</body>
</html>
